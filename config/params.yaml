common:
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible

preprocess:
    lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 64
    blind: 0.65
    timestamp_unit: 3

mapping:
    point_filter_num: 4
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     150
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [0, 0, 0]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]
publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
    dashboard: true
    debug: false

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

filter:
    max_iteration: 5
    photo_scale: 0.00095

image:
    patch_size: 5
    max_range: 30
    max_lifetime: 25
    min_range: 0.7
    suppression_radius: 10
    num_features: 60
    grad_min: 16.5
    ncc_threshold: 0.7075
    margin: 10
    intensity_scale: 0.25
    window: [41, 7]
    #masks: [0, 84, 70, 44, 953, 84, 70, 44] #for 1024x10 128-beam
    masks: [0, 0, 1024, 10,   0, 54, 1024, 10] #for 64-beam 1024x10 mode
    #masks: [0,  0, 512, 10,  0, 54, 512, 10]
    #masks: []

loop_closure:
    enable: false                    # set true to activate loop closure
    frequency: 4.0                   # detection rate (Hz)
    search_radius: 15.0              # KD-tree radius for candidate search (m)
    time_diff_threshold: 30.0        # minimum time gap between cur/pre keyframes (s)
    fitness_score_threshold: 0.3     # ICP fitness score rejection threshold (lower = stricter)
    keyframe_distance: 1.0           # minimum translation to accept a new keyframe (m)
    keyframe_angle: 0.2              # minimum rotation to accept a new keyframe (rad)
    submap_size: 20                  # half-width of historical submap (keyframes on each side)
    icp_max_iterations: 100          # ICP iteration cap
    icp_max_correspondence_dist: 150.0  # ICP max correspondence distance (m)